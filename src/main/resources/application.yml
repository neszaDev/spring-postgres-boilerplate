spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/boilerplate}
    username: ${DB_USERNAME:boilerplate}
    password: ${DB_PASSWORD:boilerplate}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

app:
  security:
    jwt:
      # Default placeholder for CI/tests (32 bytes). Override via JWT_SECRET in env.
      secret: ${JWT_SECRET:00000000000000000000000000000000}
      access-token-ttl: 15m
      refresh-token-ttl: 30d
    refresh-token-cleanup-ms: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# Profiles
---
spring:
  profiles: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-secret-placeholder}
    refresh-token-cleanup-ms: 86400000
