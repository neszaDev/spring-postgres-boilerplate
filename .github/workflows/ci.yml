name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  format-check:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Maven
        run: sudo apt-get update && sudo apt-get install -y maven
      - name: Spotless check
        run: mvn -B spotless:check

  build:
    name: Build and test
    runs-on: ubuntu-latest
    needs: format-check
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles("**/pom.xml") }}
          restore-keys: |
            ${{ runner.os }}-m2-
      - name: Install Maven
        run: sudo apt-get update && sudo apt-get install -y maven
      - name: Build and test
        env:
          DB_URL: jdbc:postgresql://localhost:5432/boilerplate
          DB_USERNAME: boilerplate
          DB_PASSWORD: boilerplate
        run: |
          mvn -B test


