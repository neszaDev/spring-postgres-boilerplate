name: Apply Spotless Formatting

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to apply formatting to'
        required: true
        default: 'ci/verify-debug'

permissions:
  contents: write

jobs:
  apply-format:
    name: Apply Spotless
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install Maven
        run: sudo apt-get update && sudo apt-get install -y maven

      - name: Run Spotless apply
        run: mvn -B spotless:apply

      - name: Commit & push formatting changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "style: apply Spotless formatting (automated)" || echo 'no commit'
            git push origin HEAD:${{ github.event.inputs.branch }}
          else
            echo 'No changes from spotless:apply'
          fi

