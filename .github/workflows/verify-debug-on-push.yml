name: Verify Debug (push)

on:
  push:
    branches:
      - 'ci/verify-debug'

jobs:
  verify-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run verbose Verify (skip ITs)
        run: |
          mvn -X -e -DskipITs=true -B clean verify 2>&1 | tee mvn-verify-debug.log || true
      - name: Upload verbose log
        uses: actions/upload-artifact@v4
        with:
          name: verify-debug-logs
          path: mvn-verify-debug.log
      - name: Upload test reports (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/**/surefire-reports
            target/**/failsafe-reports