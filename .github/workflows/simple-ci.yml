name: Simple CI Test
on:
  push:
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Print info
        run: |
          echo "RUNNING SIMPLE CI TEST"
          echo "Branch: $GITHUB_REF"
          uname -a || true
          java -version || true
          echo "Done"
